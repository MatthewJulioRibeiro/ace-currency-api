name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ace-currency-api" >> "$GITHUB_ENV"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ACE_VM_SSH_KEY }}

      - name: Fetch the licensed ACE runtime from ace-demo
        run: |
          mkdir -p ~/.ssh runtime
          ssh-keyscan -H "${{ secrets.ACE_VM_HOST }}" >> ~/.ssh/known_hosts
          scp "${{ secrets.ACE_VM_USER }}@${{ secrets.ACE_VM_HOST }}:~/ace-runtime/ace-developer.tar.gz" runtime/ace-developer.tar.gz

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub-hosted runners are x86_64 already -- this is a *native* build,
      # no QEMU emulation needed. ace-demo (1 vCPU/1GB) used to run this
      # `docker build` itself and reliably swap-thrashed into 30-40+ minute
      # builds; building here instead is both faster and free (unlimited
      # Actions minutes on a public repo).
      #
      # Runners are ephemeral (no local Docker cache survives between runs),
      # so a plain `docker build` re-executes every instruction from scratch
      # each deploy -- including the ~2.4GB runtime-extraction layer, even
      # though its input (the licensed tarball) never changes. That produced
      # a *new* layer digest every time, defeating the "layer-based, only
      # re-download what changed" pull on ace-demo the comment below used to
      # promise. `--cache-from`/`--cache-to type=registry` fixes this for
      # real: the build cache itself is stored in GHCR (as `:buildcache`),
      # so a cache-hit step reuses the exact same layer digest as last time
      # -- which is what actually lets both the GHCR push and ace-demo's
      # pull skip re-transferring it. `mode=max` is required (not the
      # default `mode=min`) because the runtime extraction happens in the
      # discarded `builder` stage of this multi-stage Dockerfile; `min` only
      # caches layers that end up in the final image.
      #
      # Pushed to GHCR *private* (this image bakes in IBM's licensed ACE
      # runtime, which the README already can't commit to the repo for the
      # same redistribution reason -- a public registry pull would be no
      # different).
      - name: Build and push image
        run: |
          docker buildx build \
            --cache-from type=registry,ref=$IMAGE:buildcache \
            --cache-to type=registry,ref=$IMAGE:buildcache,mode=max \
            -t $IMAGE:latest \
            --push \
            .

      - name: Pull image on ace-demo and restart
        # ServerAliveInterval/CountMax: ace-demo is a 1GB VM that swap-thrashes
        # under load (e.g. extracting the ~2.4GB runtime layer), which has been
        # observed to stall long enough for the SSH connection to die with
        # "Broken pipe" mid-pull. Keepalive probes stop that from happening
        # just because the connection looked idle.
        run: |
          ssh-keyscan -H "${{ secrets.ACE_VM_HOST }}" >> ~/.ssh/known_hosts
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=8 "${{ secrets.ACE_VM_USER }}@${{ secrets.ACE_VM_HOST }}" '
            set -e
            ok=false
            for i in 1 2 3; do
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin && docker pull '"$IMAGE"':latest && { ok=true; break; }
              echo "login/pull attempt $i failed, retrying in 10s..."
              sleep 10
            done
            $ok
            docker logout ghcr.io
            docker stop ace-currency-api-app 2>/dev/null || true
            docker rm ace-currency-api-app 2>/dev/null || true
            docker run -d --name ace-currency-api-app \
              -p 127.0.0.1:7800:7800 \
              -p 127.0.0.1:7600:7600 \
              -e INGEST_URL="${{ secrets.INGEST_URL }}" \
              -e INGEST_TOKEN="${{ secrets.INGEST_TOKEN }}" \
              --restart unless-stopped \
              '"$IMAGE"':latest
            # Each deploy overwrites the local :latest tag, leaving the
            # previous version'"'"'s layers dangling (untagged, unreferenced by
            # any container). This VM is small (45GB disk) and those add up
            # fast -- left unpruned, this is exactly what silently filled the
            # disk to 95% and caused a real deploy failure (see PROGRESS.md,
            # 2026-08-14). `docker image prune -f` (no -a) only removes
            # dangling images, never the one the running container actually
            # uses, so this is safe to run unconditionally after every deploy.
            docker image prune -f
          '
