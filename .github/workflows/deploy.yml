name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/ace-currency-api" >> "$GITHUB_ENV"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ACE_VM_SSH_KEY }}

      - name: Fetch the licensed ACE runtime from ace-demo
        run: |
          mkdir -p ~/.ssh runtime
          ssh-keyscan -H "${{ secrets.ACE_VM_HOST }}" >> ~/.ssh/known_hosts
          scp "${{ secrets.ACE_VM_USER }}@${{ secrets.ACE_VM_HOST }}:~/ace-runtime/ace-developer.tar.gz" runtime/ace-developer.tar.gz

      # GitHub-hosted runners are x86_64 already -- this is a *native* build,
      # no QEMU emulation needed. ace-demo (1 vCPU/1GB) used to run this
      # `docker build` itself and reliably swap-thrashed into 30-40+ minute
      # builds; building here instead is both faster and free (unlimited
      # Actions minutes on a public repo).
      - name: Build image
        run: docker build -t $IMAGE:latest .

      # Pushed to GHCR *private* (this image bakes in IBM's licensed ACE
      # runtime, which the README already can't commit to the repo for the
      # same redistribution reason -- a public registry pull would be no
      # different). A registry pull is layer-based and resumable, unlike the
      # single raw `scp`/pipe this replaced, which kept dying mid-transfer
      # trying to push the ~2.5GB image to ace-demo's constrained bandwidth
      # in one shot. The ACE runtime layer doesn't change between deploys,
      # so after the first pull, ace-demo only re-downloads the small
      # top layers (the app BAR, ESQL, Log4j config) on future deploys.
      - name: Push image to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push $IMAGE:latest

      - name: Pull image on ace-demo and restart
        run: |
          ssh-keyscan -H "${{ secrets.ACE_VM_HOST }}" >> ~/.ssh/known_hosts
          ssh "${{ secrets.ACE_VM_USER }}@${{ secrets.ACE_VM_HOST }}" '
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull '"$IMAGE"':latest
            docker logout ghcr.io
            docker stop ace-currency-api-app 2>/dev/null || true
            docker rm ace-currency-api-app 2>/dev/null || true
            docker run -d --name ace-currency-api-app \
              -p 127.0.0.1:7800:7800 \
              --restart unless-stopped \
              '"$IMAGE"':latest
          '
