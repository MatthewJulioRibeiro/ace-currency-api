name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.ACE_VM_SSH_KEY }}
            ${{ secrets.ACE_BUILDER_SSH_KEY }}

      - name: Sync source to build VM
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.ACE_BUILDER_HOST }}" >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude 'runtime' --exclude '.git' \
            ./ "${{ secrets.ACE_BUILDER_USER }}@${{ secrets.ACE_BUILDER_HOST }}:~/ace-currency-api-build/"

      # ace-demo is a 1 vCPU/1GB Always Free VM -- too tight to reliably run
      # `docker build` itself (microdnf installs, unpacking the ~2.4GB ACE
      # runtime, ibmint packaging) without swap-thrashing for 30-40+ minutes.
      # mule-demo-arm has spare capacity (12GB, its own app uses ~650MB) and
      # cross-builds the x86_64 image via QEMU emulation (docker buildx +
      # tonistiigi/binfmt, one-time setup already done on that VM), capped
      # at 1.2 CPU / 6GB via `docker update` on the buildkit container so it
      # can never starve the live Mule app running alongside it.
      - name: Cross-build x86_64 image on the ARM build VM
        run: |
          ssh "${{ secrets.ACE_BUILDER_USER }}@${{ secrets.ACE_BUILDER_HOST }}" '
            set -e
            cp ~/ace-runtime/ace-developer.tar.gz ~/ace-currency-api-build/runtime/ace-developer.tar.gz
            cd ~/ace-currency-api-build
            docker buildx build --builder ace-cross-builder --platform linux/amd64 -t ace-currency-api:latest --load .
            docker save ace-currency-api:latest | gzip > /tmp/ace-currency-api-image.tar.gz
          '

      - name: Transfer built image to the ACE VM
        run: |
          ssh-keyscan -H "${{ secrets.ACE_VM_HOST }}" >> ~/.ssh/known_hosts
          ssh "${{ secrets.ACE_BUILDER_USER }}@${{ secrets.ACE_BUILDER_HOST }}" \
            "cat /tmp/ace-currency-api-image.tar.gz" \
            | ssh "${{ secrets.ACE_VM_USER }}@${{ secrets.ACE_VM_HOST }}" \
            "cat > /tmp/ace-currency-api-image.tar.gz"
          ssh "${{ secrets.ACE_BUILDER_USER }}@${{ secrets.ACE_BUILDER_HOST }}" 'rm -f /tmp/ace-currency-api-image.tar.gz'

      - name: Load image and restart container on ACE VM
        run: |
          ssh "${{ secrets.ACE_VM_USER }}@${{ secrets.ACE_VM_HOST }}" '
            set -e
            gunzip -c /tmp/ace-currency-api-image.tar.gz | docker load
            rm -f /tmp/ace-currency-api-image.tar.gz
            docker stop ace-currency-api-app 2>/dev/null || true
            docker rm ace-currency-api-app 2>/dev/null || true
            docker run -d --name ace-currency-api-app \
              -p 127.0.0.1:7800:7800 \
              --restart unless-stopped \
              ace-currency-api:latest
          '
