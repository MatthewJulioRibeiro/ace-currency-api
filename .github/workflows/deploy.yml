name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ACE_VM_SSH_KEY }}

      - name: Fetch the licensed ACE runtime from ace-demo
        run: |
          mkdir -p ~/.ssh runtime
          ssh-keyscan -H "${{ secrets.ACE_VM_HOST }}" >> ~/.ssh/known_hosts
          scp "${{ secrets.ACE_VM_USER }}@${{ secrets.ACE_VM_HOST }}:~/ace-runtime/ace-developer.tar.gz" runtime/ace-developer.tar.gz

      # GitHub-hosted runners are x86_64 already -- this is a *native* build,
      # no QEMU emulation needed. ace-demo (1 vCPU/1GB) used to run this
      # `docker build` itself and reliably swap-thrashed into 30-40+ minute
      # builds; building here instead is both faster and free (unlimited
      # Actions minutes on a public repo).
      - name: Build image
        run: docker build -t ace-currency-api:latest .

      - name: Ship image to ace-demo and restart
        run: |
          docker save ace-currency-api:latest | gzip > /tmp/ace-currency-api-image.tar.gz
          scp /tmp/ace-currency-api-image.tar.gz "${{ secrets.ACE_VM_USER }}@${{ secrets.ACE_VM_HOST }}:/tmp/ace-currency-api-image.tar.gz"
          ssh "${{ secrets.ACE_VM_USER }}@${{ secrets.ACE_VM_HOST }}" '
            set -e
            gunzip -c /tmp/ace-currency-api-image.tar.gz | docker load
            rm -f /tmp/ace-currency-api-image.tar.gz
            docker stop ace-currency-api-app 2>/dev/null || true
            docker rm ace-currency-api-app 2>/dev/null || true
            docker run -d --name ace-currency-api-app \
              -p 127.0.0.1:7800:7800 \
              --restart unless-stopped \
              ace-currency-api:latest
          '
